# On every push: typecheck + tests of the TypeScript core, then a real iOS build of the Expo app
# (prebuild → CocoaPods → xcodebuild for the simulator, no signing). Compiler warnings/errors become annotations.
name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true; xcodebuild -version
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (TypeScript core)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          echo "::notice title=Tests::$(grep -E '^# (pass|fail)' test.log | tr '\n' ' ')"
      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
      - name: Pods
        run: cd ios && pod install
      - name: Build (simulator, no signing)
        run: |
          cd ios
          xcodebuild -workspace NeoPen.xcworkspace -scheme NeoPen -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > ../sim.log 2>&1 || true
          cd ..
          # warnings and errors from our own code (the native module), then the overall result
          grep -E "^/.*modules/neopen-ble/.*: (error|warning): " sim.log | sort -u | head -40 | while IFS= read -r l; do
            k=$(echo "$l" | sed -E 's/^.*: (error|warning): .*/\1/'); echo "::$k::$l"
          done
          grep -iE "error[: ]|fatal|failed" sim.log | grep -vE "^\s*$|warning:|-Werror|errors\.swift|Error\.swift" | sort -u | head -9 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
          echo "::notice title=Last lines::$(tail -25 sim.log | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          echo "::notice title=Simulator build::$(grep -E 'BUILD (SUCCEEDED|FAILED)' sim.log | tail -1); module warnings: $(grep -cE 'modules/neopen-ble/.*: warning: ' sim.log)"
          grep -q "BUILD SUCCEEDED" sim.log
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
          if-no-files-found: ignore
