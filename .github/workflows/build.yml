# Su ogni push: prove del nucleo (NeoPenKit) e compilazione dell'app per il simulatore (senza firma).
name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true; xcodebuild -version
      - name: Prove di NeoPenKit
        run: cd NeoPenKit && swift test
      - name: Compila l'app (simulatore, senza firma)
        run: |
          set -o pipefail
          xcodebuild -project NeoPen.xcodeproj -scheme NeoPen \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Registro di compilazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
