# On every push: typecheck + tests of the TypeScript core, then a real iOS build of the Expo app
# (prebuild → CocoaPods → xcodebuild for the simulator, no signing). Compiler warnings/errors become annotations.
name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode
        # Expo SDK 58 needs Xcode 26 (Swift 6.2): pick the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || ls -d /Applications/Xcode.app)"
          xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | head -1), $(swift --version 2>&1 | head -1)"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Obsidian plugin (types and build, same code the app runs)
        run: |
          cd plugin
          npm ci
          npm run build
      - name: Tests (TypeScript core)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          echo "::notice title=Tests::$(grep -E '^# (pass|fail)' test.log | tr '\n' ' ')"
      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
      - name: Pods
        run: cd ios && pod install
      - name: Build (simulator, no signing)
        run: |
          cd ios
          xcodebuild -workspace NeoPen.xcworkspace -scheme NeoPen -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > ../sim.log 2>&1 || true
          cd ..
          # warnings and errors from our own code (the native module), then the overall result
          grep -E "^/.*modules/neopen-ble/.*: (error|warning): " sim.log | sort -u | head -40 | while IFS= read -r l; do
            k=$(echo "$l" | sed -E 's/^.*: (error|warning): .*/\1/'); echo "::$k::$l"
          done
          grep -q "BUILD SUCCEEDED" sim.log || grep -iE "error[: ]|fatal|failed" sim.log | grep -vE "^\s*$|warning:|-Werror|errors\.swift|Error\.swift" | sort -u | head -9 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
          enc() { cut -c1-400 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          grep -q "BUILD SUCCEEDED" sim.log || echo "::notice title=Context::$(grep -B2 -A14 -E 'Could not resolve|build commands failed' sim.log | head -60 | enc)"
          grep -q "BUILD SUCCEEDED" sim.log || echo "::notice title=Last lines::$(tail -30 sim.log | enc)"
          echo "::notice title=Simulator build::$(grep -E 'BUILD (SUCCEEDED|FAILED)' sim.log | tail -1); module warnings: $(grep -cE 'modules/neopen-ble/.*: warning: ' sim.log)"
          grep -q "BUILD SUCCEEDED" sim.log
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
          if-no-files-found: ignore
