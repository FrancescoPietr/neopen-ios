# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Il file NeoPen.xcodeproj è già incluso; se cambi questo file: `xcodegen generate`.
name: NeoPen
options:
  bundleIdPrefix: com.neopen
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  NeoPenKit:
    path: NeoPenKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  NeoPen:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NeoPenKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Neo Pen
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: it
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: "Neo Pen si collega alla tua Neo Smartpen per scaricare le pagine che scrivi, anche con l'app in background."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neopen.app
        PRODUCT_NAME: NeoPen
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
schemes:
  NeoPen:
    build:
      targets:
        NeoPen: all
    test:
      gatherCoverageData: false
